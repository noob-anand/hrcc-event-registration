name: Scheduled 7 PM B.Tech 1st Year Update

on:
  schedule:
    # 7:00 PM IST (UTC+5:30) = 13:30 UTC
    - cron: '30 13 24 9 *'
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  update-btech-year:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute B.Tech 1st Year Update Script
        run: node scripts/update-btech-1st-year.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "Automated 7 PM Update: Add 1st Year option for B.Tech degree" && git push)
